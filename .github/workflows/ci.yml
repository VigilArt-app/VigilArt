name: CI

on:
  push:
    branches:
      - '**'
      - '!dev'
      - '!main'
    paths:
      - 'backend/**'
      - 'web-app/**'
      - 'shared/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'docker-compose.prod.yml'
      - '.github/workflows/ci.yml'
  workflow_call:
    secrets:
      DOPPLER_TEST_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  changes:
    if: github.repository != 'EpitechPGE45-2025/G-EIP-700-PAR-7-1-eip-39'
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      shared: ${{ steps.filter.outputs.shared }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Check path changes
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'web-app/**'
            shared:
              - 'shared/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            infra:
              - 'docker-compose.prod.yml'
              - '.github/workflows/ci.yml'

  run-tests:
    needs: changes
    if: |
      github.repository != 'EpitechPGE45-2025/G-EIP-700-PAR-7-1-eip-39' &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.infra == 'true')
    name: 🧪 Run E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install pnpm
        uses: pnpm/action-setup@eae0cfeb286e66ffb5155f1a79b90583a127a68b # v2
        with:
          version: 10.20.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@014df23b1329b615816a38eb5f473bb9000700b1 # v3

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Shared Package
        run: pnpm --filter @vigilart/shared build

      - name: Generate Prisma Client
        run: pnpm --filter @vigilart/backend db:generate

      - name: Run E2E Tests
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TEST_TOKEN }}
          COOKIE_DOMAIN: ${{ vars.COOKIE_DOMAIN }}
        run: doppler run -- bash -c 'export COOKIE_DOMAIN=$COOKIE_DOMAIN && pnpm --filter @vigilart/backend test:e2e'

  smoke-test:
    needs: changes
    if: |
      github.repository != 'EpitechPGE45-2025/G-EIP-700-PAR-7-1-eip-39' &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.infra == 'true')
    name: 🔥 Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@014df23b1329b615816a38eb5f473bb9000700b1 # v3

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run smoke test
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TEST_TOKEN }}
        run: |
          cleanup() {
            echo 'Cleaning up containers...'
            doppler run -- docker compose -f docker-compose.prod.yml down -v
          }
          trap cleanup EXIT

          echo 'Building images...'
          COMPOSE_DOCKER_CLI_BUILD=1 DOCKER_BUILDKIT=1 doppler run -- docker compose -f docker-compose.prod.yml build

          echo 'Starting database...'
          doppler run -- docker compose -f docker-compose.prod.yml up -d --wait db

          echo 'Running database migrations...'
          doppler run -- docker compose -f docker-compose.prod.yml --profile migrate run --rm migrator
          echo '✅ Migrations successful'

          echo 'Starting backend and frontend...'
          if ! doppler run -- docker compose -f docker-compose.prod.yml up -d --wait backend frontend; then
            echo 'CONTAINER FAILED TO BECOME HEALTHY ! DUMPING FRONTEND LOGS:'
            docker compose -f docker-compose.prod.yml logs frontend
            exit 1
          fi
          echo '✅ Smoke test passed: build, migrations, and health checks successful.'
