name: Deploy to dev

on:
  push:
    branches:
      - dev
    paths:
      - 'backend/**'
      - 'web-app/**'
      - 'shared/**'
      - 'mobile-app/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'docker-compose.prod.yml'
      - '.github/workflows/deploy-dev.yml'
      - '.github/workflows/ci.yml'

permissions:
  packages: write
  contents: write

jobs:
  run-ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  check-changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Check path changes
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'shared/**'
            frontend:
              - 'web-app/**'
              - 'shared/**'
            mobile:
              - 'mobile-app/**'

  build-backend:
    name: 📦 Build & Push Backend
    runs-on: ubuntu-latest
    needs: [run-ci, check-changes]
    if: needs.check-changes.outputs.backend == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Log in to GitHub container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repo owner
        id: repo-owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> ${GITHUB_OUTPUT}

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push backend
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: backend/Dockerfile.prod
          push: true
          tags: ghcr.io/${{ steps.repo-owner.outputs.owner }}/vigilart-backend:dev
          cache-from: type=registry,ref=ghcr.io/${{ steps.repo-owner.outputs.owner }}/vigilart-backend:buildcache-dev
          cache-to: type=registry,ref=ghcr.io/${{ steps.repo-owner.outputs.owner }}/vigilart-backend:buildcache-dev,mode=max,image-manifest=true,oci-mediatypes=true

  build-frontend:
    name: 📦 Build & Push Frontend
    runs-on: ubuntu-latest
    needs: [run-ci, check-changes]
    if: needs.check-changes.outputs.frontend == 'true'
    environment:
      name: Development
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Log in to GitHub container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repo owner
        id: repo-owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> ${GITHUB_OUTPUT}

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push frontend
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: web-app/Dockerfile.prod
          push: true
          tags: ghcr.io/${{ steps.repo-owner.outputs.owner }}/vigilart-frontend:dev
          cache-from: type=registry,ref=ghcr.io/${{ steps.repo-owner.outputs.owner }}/vigilart-frontend:buildcache-dev
          cache-to: type=registry,ref=ghcr.io/${{ steps.repo-owner.outputs.owner }}/vigilart-frontend:buildcache-dev,mode=max,image-manifest=true,oci-mediatypes=true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_APP_ENV=development
            NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
            API_URL=${{ secrets.API_URL }}
            NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
            NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
            NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
            NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
            NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
            NEXT_PUBLIC_FIREBASE_VAPID_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_VAPID_KEY }}

  deploy:
    name: 🚀 Deploy to dev
    runs-on: ubuntu-latest
    needs: [run-ci, check-changes, build-backend, build-frontend]
    if: |
      always() &&
      needs.run-ci.result == 'success' &&
      (needs.check-changes.outputs.backend == 'true' || needs.check-changes.outputs.frontend == 'true') &&
      (needs.build-backend.result == 'success' || needs.build-backend.result == 'skipped') &&
      (needs.build-frontend.result == 'success' || needs.build-frontend.result == 'skipped')
    environment:
      name: Development

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Lowercase repo owner
        id: repo-owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> ${GITHUB_OUTPUT}

      - name: Deploy via SSH to dev
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd /srv/VigilArt
            echo ${{ secrets.GITHUB_TOKEN }} | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin
            sudo REPO_OWNER=${{ steps.repo-owner.outputs.owner }} bash ./deploy.sh

  release-mobile:
    name: 📱 Release Mobile App (dev)
    runs-on: ubuntu-latest
    needs: [run-ci, check-changes]
    if: |
      github.repository != 'EpitechPGE45-2025/G-EIP-700-PAR-7-1-eip-39' &&
      always() &&
      needs.run-ci.result == 'success' &&
      needs.check-changes.outputs.mobile == 'true'
    environment:
      name: Development

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: 'stable'
          cache: true

      - name: Configure environment secrets
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON }}
          KEYSTORE_B64: ${{ secrets.APK_RELEASE_KEYSTORE }}
        run: |
          mkdir -p mobile-app/android/app
          echo "API_BASE_URL=${API_BASE_URL}" > mobile-app/.env
          if [ -n "${GOOGLE_SERVICES_JSON_B64}" ]; then
            echo "${GOOGLE_SERVICES_JSON_B64}" | base64 -d > mobile-app/android/app/google-services.json
          fi
          if [ -n "${KEYSTORE_B64}" ]; then
            echo "${KEYSTORE_B64}" | base64 -d > /tmp/release.keystore
          fi

      - name: Install Flutter dependencies
        run: |
          cd mobile-app
          flutter pub get

      - name: Build Dev APK
        env:
          KEYSTORE_PATH: /tmp/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.APK_RELEASE_PASSWORD }}
          KEY_ALIAS: upload
        run: |
          cd mobile-app
          flutter build apk --release --build-name=dev --build-number=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/vigilart-dev.apk

      - name: Publish Rolling Dev Pre-Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="mobile-dev-latest"
          TITLE="Mobile App - Dev (Latest)"
          NOTES="Continuous development build of the VigilArt mobile application for the \`dev\` branch.

          - **Commit:** \`${{ github.sha }}\`
          - **Run:** #${{ github.run_number }}
          - **Triggered by:** ${{ github.actor }}"
          APK_PATH="mobile-app/build/app/outputs/flutter-apk/vigilart-dev.apk"

          # Delete existing release and tag so the tag points to the current HEAD cleanly
          gh release delete "$TAG" --cleanup-tag -y || true

          # Create fresh rolling pre-release with the new APK
          gh release create "$TAG" "$APK_PATH" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --prerelease \
            --target dev

